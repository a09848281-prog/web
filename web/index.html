<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>Remote Camera</title>
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script defer src="./app.js"></script>
</head><body>
<header class="top"><div><b>● Remote Camera</b><small> Android ⇄ iPad</small></div><div><span id="status" class="pill">未接続</span> <button id="logout" class="hidden">ログアウト</button></div></header>
<main>
<section id="auth" class="auth"><div class="card"><small>PERSONAL REMOTE CAMERA</small><h1 id="authTitle">ログイン</h1>
<form id="authForm"><label>ユーザーID<input id="userId" minlength="4" maxlength="32" required autocomplete="username"></label>
<label>パスワード<input id="password" type="password" minlength="8" maxlength="128" required autocomplete="current-password"></label>
<label id="confirmWrap" class="hidden">パスワード確認<input id="confirmPassword" type="password"></label>
<button id="authSubmit" class="primary wide">ログイン</button></form>
<button id="switchAuth" class="link wide" type="button">新規登録</button><p id="authMessage"></p></div></section>
<section id="app" class="app hidden">
<aside class="side">
<h3>端末 <button id="refresh">↻</button></h3><div id="devices"></div>
<label>端末ID<input id="deviceId" placeholder="登録済み端末ID"></label><button id="chooseDevice" class="wide">この端末を選択</button>
<hr><h3>監視操作</h3><button id="connect" class="primary wide">接続</button><button id="disconnect" class="wide" disabled>切断</button>
<label>画質<select id="quality"><option value="auto">自動</option><option value="360">360p</option><option value="480">480p</option><option value="720" selected>720p</option><option value="1080">1080p</option></select></label>
<label>通信量モード<select id="dataMode"><option value="auto">自動</option><option value="ultra">超節約</option><option value="save">節約</option><option value="standard" selected>標準</option><option value="high">高画質</option></select></label>
<label>Android音量 <output id="volumeValue">70%</output><input id="volume" type="range" min="0" max="100" value="70"></label>
<label>カメラ<select id="camera"><option value="back">背面</option><option value="front">前面</option></select></label>
<hr><h3>位置情報</h3><button id="locate" class="wide">現在位置を1回取得</button>
<label class="check"><input id="connectedLoc" type="checkbox"> 接続中に定期取得</label>
<label>接続中の間隔<select id="connectedInterval"><option>10</option><option>15</option><option selected>30</option><option>60</option><option>120</option><option>300</option></select>秒</label>
<label class="check"><input id="idleLoc" type="checkbox"> 待機中に定期取得</label>
<label>待機中の間隔<select id="idleInterval"><option>10</option><option>15</option><option>30</option><option>60</option><option>120</option><option selected>300</option></select>秒</label>
<button id="saveSettings" class="wide">設定を保存</button><button id="history" class="link wide">履歴を表示</button><button id="deleteHistory" class="link danger wide">履歴を全削除</button>
<hr><h3>音声</h3><button id="ptt" class="ptt wide" disabled>押している間だけ話す</button>
<hr><button id="pair" class="link wide">Android端末を登録</button>
<a class="download" href="https://github.com/a09848281-prog/web/actions" target="_blank" rel="noopener">APKのビルドはこちら</a>
</aside>
<section class="view">
<div class="viewhead"><div><small>LIVE VIEW</small><h2 id="deviceName">端末を選択してください</h2><p id="deviceMeta">待機中</p></div><div><button id="videoTab" class="active">映像</button><button id="mapTab">地図</button></div></div>
<div id="videoPane" class="videoPane"><video id="remoteVideo" autoplay playsinline></video><div id="placeholder"><b>映像はまだありません</b><small>端末を選択して接続してください。</small></div><footer><span id="streamState">待機中</span><span id="iceState">ICE: --</span></footer></div>
<div id="mapPane" class="hidden"><div id="map"></div><p id="locationInfo">位置情報はありません。</p></div>
<p class="footer">録画・録音機能はありません。</p>
</section></section></main>
<dialog id="pairDialog"><form method="dialog" class="dialog"><button class="close">×</button><h2>Android端末を登録</h2><p>Androidアプリに表示された8桁コードを入力してください。</p><label>登録コード<input id="pairCode" inputmode="numeric" maxlength="8" required></label><label>端末名（任意）<input id="pairName" maxlength="40"></label><button id="claim" type="button" class="primary wide">登録する</button><p id="pairMessage"></p></form></dialog>
<dialog id="historyDialog"><form method="dialog" class="dialog"><button class="close">×</button><h2>位置情報履歴</h2><div id="historyRows"></div><button class="wide">閉じる</button></form></dialog>
<div id="toast" role="status"></div>
</body></html>
