name: Validate Remote Camera v4.5.1
on:
  push:
    branches: [rebuild-v4.5.1-smart-motion-pwa]
    paths:
      - "web/**"
      - "gas/**"
      - "android/**"
      - ".github/workflows/validate-v451.yml"
  pull_request:
    branches: [rebuild-v4.2.2-ultra-stable-controls]
    paths:
      - "web/**"
      - "gas/**"
      - "android/**"
      - ".github/workflows/validate-v451.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remote-camera-v451-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Syntax and manifest checks
        run: |
          node --check web/app.js
          node --check web/sw.js
          cp gas/Code.gs /tmp/gas-check.js
          node --check /tmp/gas-check.js
          node -e 'JSON.parse(require("fs").readFileSync("web/config.json","utf8")); JSON.parse(require("fs").readFileSync("web/manifest.webmanifest","utf8"));'
      - name: Web / PWA / GAS / Android integration checks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const html = fs.readFileSync('web/index.html','utf8');
          const css = fs.readFileSync('web/app.css','utf8');
          const app = fs.readFileSync('web/app.js','utf8');
          const sw = fs.readFileSync('web/sw.js','utf8');
          const manifest = JSON.parse(fs.readFileSync('web/manifest.webmanifest','utf8'));
          const gas = fs.readFileSync('gas/Code.gs','utf8');
          const gradle = fs.readFileSync('android/app/build.gradle.kts','utf8');
          const androidManifest = fs.readFileSync('android/app/src/main/AndroidManifest.xml','utf8');
          const config = JSON.parse(fs.readFileSync('web/config.json','utf8'));
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(x=>x[1]);
          assert.equal(ids.length,new Set(ids).size,'HTML IDs must be unique');
          const missing=[...new Set([...app.matchAll(/\$\("([^"]+)"\)/g)].map(x=>x[1]).filter(x=>!ids.includes(x)))];
          assert.deepEqual(missing,[],'Every literal JS DOM reference must exist');
          const asideEnd=html.indexOf('</aside>'),viewStart=html.indexOf('<section class="view"');
          assert(asideEnd>0&&viewStart>asideEnd,'Left settings must precede right screen');
          const left=html.slice(0,asideEnd),right=html.slice(viewStart);
          for(const id of ['connect','disconnect','flashlight','captureRatio','fpsLimit','ptt','motionEnabled','addMotionZone','motionZoneList','personCandidateEnabled'])
            assert(left.includes('id="'+id+'"'),id+' must be in left controls');
          assert(right.includes('id="remoteVideo"')&&right.includes('id="motionOverlay"'),'Right screen must contain video and range overlay');
          for(const id of ['androidStatus','monitorUptime','monitorTraffic','viewerTraffic'])
            assert(right.includes('id="'+id+'"'),id+' must remain in the compact screen header');
          assert(app.includes('function findPersonCandidates')&&app.includes('function motionZoneBounds'),'Region-based motion/person candidate analysis required');
          assert(app.includes('function handleMotionPointerDown')&&app.includes('function drawMotionOverlay'),'Drag drawing and overlay required');
          assert(app.includes('person-entry')&&app.includes('person-exit')&&app.includes('function movementDirection'),'Person candidate entry/exit/direction events required');
          assert(app.includes('MOTION_WIDTH = 160')&&app.includes('MAX_MOTION_ZONES = 8'),'Bounded local motion processing required');
          assert(app.includes('バックグラウンドではOSの制御により検知を一時停止'),'Background limitation must be disclosed');
          assert(html.includes('rel="manifest"')&&manifest.display==='standalone'&&manifest.scope==='./','PWA manifest install settings required');
          assert(sw.includes('addEventListener("fetch"')&&/url\.origin\s*!==\s*self\.location\.origin/.test(sw),'Service worker must only cache same-origin resources');
          assert(!/addEventListener\(["']push["']/.test(sw),'No external push provider implementation allowed');
          assert(css.includes('v4.5.1 — clean white interface')&&css.includes('.view{background:#fff'),'White interface overrides required');
          assert(gas.includes('const version = "4.5.1"')&&gas.includes('result.apiVersion = "4.5.1"'),'GAS version must be 4.5.1');
          assert(gas.includes('const TABLES =')&&gas.includes('Controllers:'),'Existing spreadsheet schemas/controllers must remain');
          assert(/applicationId\s*=\s*"jp\.a09848281\.remotecamera\.v451preview"/.test(gradle),'APK must be side-by-side installable');
          assert(/versionCode\s*=\s*451/.test(gradle)&&/versionName\s*=\s*"4.5.1"/.test(gradle)&&config.appVersion==='4.5.1','Android/Web version alignment failed');
          assert(androidManifest.includes('Remote Camera 4.5.1 Preview'),'Android label mismatch');
          assert(!/firebase|tensorflow|mediapipe/i.test(gradle+app),'No Firebase or new ML SDK dependency allowed');
          console.log('Remote Camera v4.5.1 source integration checks passed.');
          NODE
      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-camera-debug-apk-v4.5.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
