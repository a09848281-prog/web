name: Validate Remote Camera v4.5 Preview

on:
  push:
    branches: [rebuild-v4.5-motion-zones-white-ui]
    paths:
      - "web/**"
      - "gas/**"
      - "android/**"
      - "docs/**"
      - ".github/workflows/validate-v45.yml"
  pull_request:
    branches: [rebuild-v4.2.2-ultra-stable-controls]
    paths:
      - "web/**"
      - "gas/**"
      - "android/**"
      - ".github/workflows/validate-v45.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-camera-v45-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: JavaScript and GAS syntax
        run: |
          node --check web/app.js
          node --check web/motion-regions.js
          node web/motion-regions.test.cjs
          cp gas/Code.gs /tmp/gas-check.js
          node --check /tmp/gas-check.js
      - name: Web, GAS and Android integration checks
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const css = fs.readFileSync('web/app.css', 'utf8');
          const app = fs.readFileSync('web/app.js', 'utf8');
          const motion = fs.readFileSync('web/motion-regions.js', 'utf8');
          const gas = fs.readFileSync('gas/Code.gs', 'utf8');
          const rtc = fs.readFileSync('android/app/src/main/java/jp/a09848281/remotecamera/RtcEngine.kt', 'utf8');
          const service = fs.readFileSync('android/app/src/main/java/jp/a09848281/remotecamera/MonitorService.kt', 'utf8');
          const gradle = fs.readFileSync('android/app/build.gradle.kts', 'utf8');
          const manifest = fs.readFileSync('android/app/src/main/AndroidManifest.xml', 'utf8');
          const config = JSON.parse(fs.readFileSync('web/config.json', 'utf8'));
          const webManifest = JSON.parse(fs.readFileSync('web/manifest.webmanifest', 'utf8'));

          const ids = [...html.matchAll(/\\bid="([^"]+)"/g)].map(x => x[1]);
          assert.equal(ids.length, new Set(ids).size, 'HTML IDs must be unique');
          const missing = [...new Set([...app.matchAll(/\\$\("([^"]+)"\)/g)].map(x => x[1]).filter(x => !ids.includes(x)))];
          assert.deepEqual(missing, [], 'Every literal JS element reference must exist in HTML');

          const asideEnd = html.indexOf('</aside>');
          const viewStart = html.indexOf('<section class="view"');
          assert(asideEnd > 0 && viewStart > asideEnd, 'Controls must stay left and display must stay right');
          const left = html.slice(0, asideEnd);
          const right = html.slice(viewStart);
          for (const id of ['connect','disconnect','flashlight','captureRatio','fpsLimit','voiceClean','ptt','snapshot','fullscreen','motionEnabled','drawMotionRegion','clearMotionRegions','motionRegionList','motionNotifications']) {
            assert(left.includes('id="' + id + '"'), id + ' must be in the left settings/control panel');
          }
          assert(right.includes('id="remoteVideo"') && right.includes('id="mapPane"') && right.includes('id="motionOverlay"'), 'Right pane must retain video, map and selectable region overlay');
          for (const id of ['androidStatus','monitorUptime','monitorTraffic','viewerTraffic']) {
            assert(right.includes('id="' + id + '"'), id + ' must remain compact device info on the right');
          }
          assert(!right.includes('id="connect"') && !right.includes('class="viewerControls"'), 'Right pane must not contain settings/controls');

          assert(html.indexOf('motion-regions.js') < html.indexOf('app.js?v=4.5.0'), 'Motion module must load before the controller');
          assert(app.includes('function beginMotionRegionDrawing()') && app.includes('function finishMotionRegionDrawing()'), 'Drag-to-draw range editor missing');
          assert(app.includes('MAX_MOTION_REGIONS = 8') && app.includes('rc_motion_regions_v45'), 'Region limit and versioned local storage required');
          assert(app.includes('RemoteCameraMotion.measureRegions') && motion.includes('Math.abs(current[offset] - previous[offset])'), 'Pixel difference detection must be used, without a model');
          assert(app.includes('function notifyMotionEvent(event)') && app.includes('showNotification'), 'System notification path missing');
          assert(app.includes('document.hidden') && app.includes('videoPane').toLowerCase(), 'Detection must not run on a hidden/non-video pane');
          assert(!/tensorflow|onnxruntime|mediapipe|tflite|coco-ssd|teachable.?machine/i.test(html + app + motion + gradle), 'AI/ML libraries must not be included');

          assert(config.appVersion === '4.5.0', 'Web config version must be 4.5.0');
          assert(webManifest.name === 'Remote Camera 4.5 Preview' && webManifest.theme_color === '#ffffff', 'Web app manifest is invalid');
          assert(gas.includes('const version = "4.5.0"') && gas.includes('apiVersion = "4.5.0"'), 'GAS API version must be 4.5.0');
          assert(!/motion_regions|motion_event|motion_image/i.test(gas), 'Local motion zones/events must not be uploaded to GAS');

          assert(rtc.includes('fpsLimit.coerceIn(15, 60)'), 'Inherited v4.2.2 60fps camera profile missing');
          assert(service.includes('TrafficStats.getUidRxBytes'), 'Inherited monitor traffic metric missing');
          assert(/applicationId\\s*=\\s*"jp\\.a09848281\\.remotecamera\\.v45preview"/.test(gradle), 'v4.5 unique applicationId missing');
          assert(/versionCode\\s*=\\s*450/.test(gradle) && /versionName\\s*=\\s*"4.5.0"/.test(gradle), 'Android v4.5 identity mismatch');
          assert(manifest.includes('Remote Camera 4.5 Preview'), 'Android app label mismatch');
          assert(!/firebase/i.test(gradle), 'Firebase must remain excluded');

          const whiteTheme = css.slice(css.lastIndexOf('/* v4.5:'));
          for (const selector of [':root{color-scheme:light', 'html,body{background:#fff', '.top{background:#fff', '.side,.view{background:#fff', '.view .videoPane{background:#fff', '#imageViewerDialog[open]{background:#fff']) {
            assert(whiteTheme.includes(selector), 'White UI declaration missing: ' + selector);
          }
          console.log('Remote Camera v4.5 Web / GAS / Android integration checks passed.');
          NODE
      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload v4.5 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-camera-debug-apk-v4.5-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
