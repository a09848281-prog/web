name: Build Android APK
on:
  push:
    branches: [main, rebuild-v3.5-remote-standby, rebuild-v3.6-wide-stable-location, rebuild-v3.7-stability-ui, rebuild-v3.8-realtime-stability-no-firebase, rebuild-v3.9-camera-controls-stability, rebuild-v4.0-ambient-audio-ptt, rebuild-v4.1-complete-stable]
    paths:
      - "android/**"
      - "web/**"
      - "gas/**"
      - ".github/workflows/**"
  pull_request:
    branches: [rebuild-v3.9-camera-controls-stability, rebuild-v4.0-ambient-audio-ptt]
    paths:
      - "android/**"
      - "web/**"
      - "gas/**"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keep builds from different branches independent. Rapid feature commits on
  # one branch may replace that branch's build, but must not cancel main/base.
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    name: Android debug APK and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check web JavaScript syntax
        run: node --check web/app.js
      - name: Check GAS JavaScript syntax
        run: cp gas/Code.gs /tmp/gas-check.js && node --check /tmp/gas-check.js
      - name: Check Web IDs and API action compatibility
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const app = fs.readFileSync('web/app.js', 'utf8');
          const gas = fs.readFileSync('gas/Code.gs', 'utf8');
          const android = fs.readFileSync('android/app/src/main/java/jp/a09848281/remotecamera/MonitorService.kt', 'utf8');
          const main = fs.readFileSync('android/app/src/main/java/jp/a09848281/remotecamera/MainActivity.kt', 'utf8');
          const rtc = fs.readFileSync('android/app/src/main/java/jp/a09848281/remotecamera/RtcEngine.kt', 'utf8');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x => x[1]);
          const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (dupes.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(dupes)].join(', '));
          const refs = [...app.matchAll(/\$\(["']([^"']+)["']\)/g)].map(x => x[1]);
          const missing = [...new Set(refs.filter(id => !ids.includes(id)))];
          if (missing.length) throw new Error('Missing HTML IDs: ' + missing.join(', '));
          const gasActions = new Set([...gas.matchAll(/case\s+["']([a-z_]+)["']\s*:/g)].map(x => x[1]));
          const webActions = new Set([...app.matchAll(/\bapi\(["']([a-z_]+)["']/g)].map(x => x[1]));
          const androidActions = new Set([...android.matchAll(/\.call\(["']([a-z_]+)["']/g)].map(x => x[1]));
          const missingActions = [...new Set([...webActions, ...androidActions])].filter(x => !gasActions.has(x));
          if (missingActions.length) throw new Error('Missing GAS API actions: ' + missingActions.join(', '));
          if (/function\s+(register_|login_|logout_|me_)\s*\(/.test(gas) || /authForm|switchAuth|authSubmit/.test(app + html)) {
            throw new Error('Legacy account UI/API remains in active sources.');
          }
          if (!gas.includes('function health_()') || !gas.includes('DB_SPREADSHEET_ID') ||
              !app.includes('api("health")') || !app.includes('api("unpair_device"')) {
            throw new Error('GAS health/DB binding or browser API health/unpair flow is missing.');
          }
          if (!gas.includes('window.top.postMessage') ||
              app.includes('event.source !== frame.contentWindow')) {
            throw new Error('GAS HtmlService nested iframe response bridge is not configured.');
          }
          if (!android.includes('ACTION_STOP') || !android.includes('addAction(') ||
              !android.includes('stopMonitoringNow(') ||
              !android.includes('Offer handling failed; keep foreground service alive') ||
              !rtc.includes('Capture format failed:') ||
              !main.includes('refreshMonitoringButtons') ||
              !main.includes('GASでペアリング確認済み')) {
            throw new Error('Background stop action, RTC recovery, or server-verified pairing state is missing.');
          }
          const manifest = fs.readFileSync('android/app/src/main/AndroidManifest.xml', 'utf8');
          if (!manifest.includes('android.permission.INTERNET') ||
              !manifest.includes('android.permission.ACCESS_NETWORK_STATE')) {
            throw new Error('Android network permissions are missing.');
          }
          if (!main.includes('waitModeLabels') ||
              !main.includes('remoteCaptureSwitch') ||
              !android.includes('ACTION_UPDATE_LOCAL_SETTINGS') ||
              !android.includes('remoteCaptureEnabled') ||
              !rtc.includes('ACCESS_NETWORK_STATE permission verified before WebRTC initialization')) {
            throw new Error('v3.5 local standby settings or WebRTC permission guard are missing.');
          }
          if (!gas.includes('case "unpair_device"') || !gas.includes('function unpairDevice_') ||
              !app.includes('kind: "bye"') || !android.includes('"bye"') ||
              !rtc.includes('fun closeSession(')) {
            throw new Error('Unpair/revoke or clean disconnect flow is incomplete.');
          }
          if (!rtc.includes('changeCaptureFormat') ||
              !rtc.includes('chooseWidestBackCamera') ||
              !rtc.includes('stun:stun.l.google.com:19302') ||
              !rtc.includes('"16:9"') || !rtc.includes('"9:16"')) {
            throw new Error('Wide-angle camera preference, 16:9 profiles or STUN configuration is missing.');
          }
          if (!android.includes('acquireBestLocation') ||
              !android.includes('requestLocationUpdates') ||
              !android.includes('LocationManager.GPS_PROVIDER') ||
              !android.includes('LocationManager.NETWORK_PROVIDER') ||
              !main.includes('カメラ・マイクの権限は必須、位置情報は任意です')) {
            throw new Error('Optional location permission or dual-provider location acquisition is missing.');
          }
          if (!rtc.includes('Live FPS/bitrate updates do not restart Camera2') ||
              !rtc.includes('Close stale sessions after') ||
              !rtc.includes('Ignoring duplicate offer for active session') ||
              !rtc.includes('onCameraDisconnected()') ||
              !rtc.includes('onCameraFreezed(') ||
              !rtc.includes('private fun applySenderParameters') ||
              !rtc.includes('deferredFormatMessageFor')) {
            throw new Error('Smooth quality updates, stale/duplicate peer cleanup, or camera recovery is missing.');
          }
          const qualityCall = 'rtc?.setVideoProfile(currentQuality, currentDataMode, currentCaptureRatio, currentFpsLimit)';
          const offerCall = 'rtc?.handleOffer(session, signal.optString("sdp"))';
          if (!android.includes(qualityCall) || android.indexOf(qualityCall) > android.indexOf(offerCall)) {
            throw new Error('Selected quality must be applied before the initial Camera2 capture begins.');
          }
          if (!main.includes('keepAwakeSwitch') ||
              !main.includes('EXTRA_KEEP_CPU_AWAKE') ||
              !android.includes('PowerManager.PARTIAL_WAKE_LOCK') ||
              !android.includes('releaseCpuWakeLock()')) {
            throw new Error('Optional screen-off CPU wake lock control is missing.');
          }
          for (const id of ['fullscreen','fitMode','viewerZoom','connectionMetrics','sessionDuration','mapFollow','copyLocation','connect','disconnect']) {
            if (!ids.includes(id) || !app.includes(id)) throw new Error('Missing v3.6 viewer feature: ' + id);
          }
          if (!app.includes('scheduleReconnect') || !app.includes('collectConnectionStats') ||
              !app.includes('stun:stun.l.google.com:19302') ||
              !app.includes('Reuse the already-authorized microphone stream') ||
              !app.includes('visibilitychange') || !app.includes('45秒以内にAndroidから応答がありません')) {
            throw new Error('Web reconnect, mic reuse, resume recovery, diagnostics or STUN feature is missing.');
          }
          if (!app.includes('async function disconnect(sendCommand = true, preserveMic = false)') ||
              !app.includes('if (preserveMic)') ||
              !app.includes('S.manualDisconnect = true')) {
            throw new Error('Automatic reconnect must preserve the local microphone while manual disconnect stops it.');
          }
          if (!app.includes('statsFreezeCount >= 3') ||
              !app.includes('scheduleReconnect(pc, true)') ||
              !app.includes('hasReceivedVideoFrame') ||
              !app.includes('Only report a freeze after at least one remote frame has arrived.') ||
              !app.includes('failedPeer.connectionState === "connected" && !forceReconnect')) {
            throw new Error('Frozen video frames must trigger bounded forced reconnect only after an initial frame, without overriding manual disconnect.');
          }
          console.log('v3.7 inherited stability checks passed.');
          const apiClient = fs.readFileSync('android/app/src/main/java/jp/a09848281/remotecamera/ApiClient.kt', 'utf8');
          if (!app.includes('createDataChannel("remote-control"') ||
              !app.includes('function sendControlCommand') ||
              !app.includes('function startVideoWatchdog') ||
              !app.includes('requestVideoFrameCallback') ||
              !app.includes('function setReceiveVolume') ||
              !app.includes('Non-trickle ICE: no further GAS signal polling is needed') ||
              !app.includes('GASバージョン不一致') ||
              !app.includes('health.apiVersion') ||
              !html.includes('id="videoState"') ||
              !html.includes('受信音量（iPad）')) {
            throw new Error('v3.8 WebRTC control channel, video-frame watchdog, local audio gain or UI indicator is missing.');
          }
          if (!rtc.includes('override fun onDataChannel(channel: DataChannel)') ||
              !rtc.includes('onControlCommand(message)') ||
              !rtc.includes('fun hasConnectedPeer()') ||
              !rtc.includes('delay(8000L)')) {
            throw new Error('v3.8 Android data-channel command receiver or ICE recovery grace timer is missing.');
          }
          if (!android.includes('" (v4.1 Preview)"') ||
              !manifest.includes('android:label="Remote Camera 4.0 Preview"')) {
            throw new Error('v3.8 preview app must be clearly distinguishable in Android launcher and paired-device list.');
          }
          if (!android.includes('rtc?.hasConnectedPeer() == true') ||
              !android.includes('locationRequestActive') ||
              !android.includes('now - cached.time <= 60000L') ||
              !android.includes('withTimeoutOrNull(8000L)') ||
              !android.includes('GAS一時エラー：待機を継続して再試行します')) {
            throw new Error('v3.8 GAS polling pause, retry backoff or faster serialized location acquisition is missing.');
          }
          if (!apiClient.includes('retryableActions') ||
              !apiClient.includes('connectTimeout = 8000') ||
              !apiClient.includes('readTimeout = 12000') ||
              !apiClient.includes('Thread.sleep(300L')) {
            throw new Error('v3.8 Android bounded retry and shorter GAS transport timeout is missing.');
          }
          if (!gas.includes('function readTail_') ||
              !gas.includes('serverMs = Date.now() - startedAt') ||
              !gas.includes('CacheService.getScriptCache()') ||
              !gas.includes('latestSeq: Math.max(after, signalTail.lastRow)')) {
            throw new Error('v3.8 GAS indexed-tail reads, server timing or last-seen write throttling is missing.');
          }
          if (/firebase/i.test(fs.readFileSync('android/app/build.gradle.kts', 'utf8'))) {
            throw new Error('Firebase dependency is forbidden in this project.');
          }
          for (const id of ['captureRatio','fpsLimit','snapshot','flashlight','keepAwake','refreshStatus','androidStatus','audioState']) {
            if (!ids.includes(id)) throw new Error('Missing v3.9 viewer control: ' + id);
          }
          if (!app.includes('function restoreRemotePlayback') ||
              !app.includes('webkitendfullscreen') ||
              !app.includes('function takeSnapshot') ||
              !app.includes('function updateAdaptiveQuality') ||
              !app.includes('navigator.wakeLock') ||
              !app.includes('controlChannel.onmessage') ||
              !app.includes('command_result') ||
              !html.includes('16:9（横長・標準）')) {
            throw new Error('v3.9 browser camera controls, fullscreen playback recovery, adaptive streaming or new features are incomplete.');
          }
          if (!rtc.includes('JavaAudioDeviceModule.builder') ||
              !rtc.includes('MediaRecorder.AudioSource.MIC') ||
              !rtc.includes('setUseHardwareAcousticEchoCanceler(false)') ||
              !rtc.includes('setUseHardwareNoiseSuppressor(false)') ||
              !rtc.includes('manager.mode = AudioManager.MODE_NORMAL') ||
              !rtc.includes('fun setVideoProfile(') ||
              !rtc.includes('fun setFlashlight(') ||
              !rtc.includes('fun sendDeviceStatus(') ||
              !rtc.includes('FLASH_INFO_AVAILABLE')) {
            throw new Error('v3.9 Android microphone module, profile controls, torch or device-status API is missing.');
          }
          if (!main.includes('localDataModeSpinner') ||
              !main.includes('EXTRA_LOCAL_DATA_MODE') ||
              !android.includes('EXTRA_LOCAL_DATA_MODE') ||
              !android.includes('"flashlight" ->') ||
              !android.includes('put("type", "command_result")') ||
              !android.includes('v4.1 Preview')) {
            throw new Error('v3.9 Android local standby data-mode selector or command response flow is missing.');
          }
          if (!gas.includes('captureRatio:') || !gas.includes('fpsLimit:') ||
              !gas.includes('"flashlight"') || !gas.includes('4.1.0')) {
            throw new Error('v3.9 GAS compatibility, saved capture settings or flashlight command is missing.');
          }
          console.log('v3.9 aspect/FPS settings, audio input route, flash control, five viewer features, fullscreen restoration, and Firebase-free dependencies OK.');
          NODE
      - name: Verify v4.1 Android and Web version alignment
        run: |
          node <<'NODE'
          const fs = require('fs');
          const gradle = fs.readFileSync('android/app/build.gradle.kts', 'utf8');
          const config = JSON.parse(fs.readFileSync('web/config.json', 'utf8'));
          const workflow = fs.readFileSync('.github/workflows/build-and-pages.yml', 'utf8');
          if (!/applicationId\s*=\s*"jp\.a09848281\.remotecamera\.v41preview"/.test(gradle) ||
              !/versionCode\s*=\s*410/.test(gradle) ||
              !/versionName\s*=\s*"4\.1\.0"/.test(gradle) ||
              config.appVersion !== '4.1.0' ||
              !workflow.includes('name: remote-camera-debug-apk-v4.1')) {
            throw new Error('Android versionCode/versionName, Web appVersion, and APK artifact name must all identify v4.1.0.');
          }
          console.log('Android 4.1.0 / versionCode 410 / Web 4.1.0 / APK artifact v4.1 are aligned.');
          NODE
      - name: Build Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify permissions inside the built APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$AAPT"
          "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/remote-camera-apk-permissions.txt
          for permission in \
            android.permission.INTERNET \
            android.permission.ACCESS_NETWORK_STATE \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO; do
            grep -Fq "$permission" /tmp/remote-camera-apk-permissions.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: remote-camera-debug-apk-v4.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
