name: Build Android APK and deploy Web
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/**"
      - "gas/**"
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check web JavaScript syntax
        run: node --check web/app.js
      - name: Check GAS JavaScript syntax
        run: cp gas/Code.gs /tmp/gas-check.js && node --check /tmp/gas-check.js
      - name: Build Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: remote-camera-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: android-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
