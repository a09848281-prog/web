name: Deploy Remote Camera v4.2 Preview
on:
  push:
    branches:
      - rebuild-v4.2-multi-viewer-camera
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages-v42-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload v4.2 website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy v4.2 website
        uses: actions/deploy-pages@v4
